name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "_v0/**"
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "_v0/**"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx expo lint

      - name: Test
        run: npx jest --testPathIgnorePatterns='/node_modules/' --testPathIgnorePatterns='/_v0/'
